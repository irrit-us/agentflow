# Runtime-expanded security audit: plan -> per-link audit -> review.
# The planner controls the amount of work without requiring a static node list.
name: lite-dynamic-audit
resource_settings:
  model-endpoint:
    max_concurrency: 2
  repository:
    max_concurrency: 4
  guidance-catalog:
    max_concurrency: 2
  report-output:
    max_concurrency: 1
nodes:
  - id: plan-links
    prompt: |
      Map the target repository to the vulnerability knowledge base. Return only
      JSON in this shape:
      {"links":[{"id":"L-001","semantic":"...","vulnerability":"..."}]}
    skills: [repository-read]
    trigger_mode: output_idle
    resources:
      - name: model-endpoint
        access: read
      - name: repository
        access: read
    priority: 100
    max_iterations: 4
    max_total_tokens: 6000
    max_attempts: 1

  - id: audit-link
    prompt: |
      Audit semantic-vulnerability link {{ link.id }}.
      Semantic: {{ link.semantic }}
      Vulnerability: {{ link.vulnerability }}
      Use read-only repository evidence. Design, but do not execute, a minimal
      non-destructive validation plan and return structured evidence.
    fanout:
      from: plan-links
      items_path: links
      item_var: link
      max_items: 16
    skills: [repository-read, security-guidance]
    trigger_mode: input_and_output
    resources:
      - name: model-endpoint
        access: read
      - name: guidance-catalog
        access: read
      - name: repository
        access: read
    priority: 50
    max_iterations: 4
    max_total_tokens: 6000
    max_attempts: 1

  - id: review-findings
    prompt: |
      Review, deduplicate, and rank these completed link audits:
      {{ nodes.audit-link.text }}
    depends_on: [audit-link]
    skills: [report-publishing]
    trigger_mode: input_ready
    resources:
      - name: model-endpoint
        access: read
      - name: report-output
        access: write
    priority: 10
    max_iterations: 4
    max_total_tokens: 6000
    max_attempts: 1
