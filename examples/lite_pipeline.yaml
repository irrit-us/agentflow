# Three-node security audit pipeline: scan → analyze → report.
# scan → analyze is declared with explicit edges; report uses depends_on
# (the two styles are equivalent).
name: lite-audit
nodes:
  - id: scan
    prompt: |
      Scan the Python code in the current repository for suspicious dangerous
      calls (e.g. subprocess, eval, exec, pickle.loads). List each finding with
      its file and line number. If nothing is found, reply "NONE".
    system_prompt: You are a security auditor. Perform read-only analysis only, and cite evidence locations for every conclusion.
    max_iterations: 8
  - id: analyze
    prompt: |
      Below are the scan results:

      {{ nodes.scan.text }}

      For each item, judge whether it is a genuinely exploitable risk,
      rank them by severity, and explain your reasoning.
    max_iterations: 6
  - id: report
    prompt: |
      Based on the analysis below, produce an audit report containing a
      summary, a risk list, and remediation suggestions:

      {{ nodes.analyze.text }}
    depends_on:
      - analyze
    max_total_tokens: 20000
edges:
  - from: scan
    to: analyze
