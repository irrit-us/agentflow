# PwnGPT: single LLM with three modules -- decompilation-routed analysis -> exploit generation and run-verification inner loop. Source document: 01-binary
name: pwngpt
nodes:
  - id: binary-analysis
    prompt: Decompile the target binary into C code and route it by code size into simple or complex analysis workflows.
    container:
      image: agentflow-tools/re-ghidra:latest
      mounts:
        - {type: bind, source: ./targets, target: /targets, read_only: true}
        - {type: volume, source: pwngpt-shared, target: /shared}
  - id: exploit-verify-loop
    prompt: Acting as a CTF expert, generate an exploit and run it in a sandbox for verification; runtime errors flow back for retry inside the node, with the inner loop carried by LiteAgent max_iterations.
    max_iterations: 8
    container:
      image: python:3.12-slim
      mounts:
        - {type: volume, source: pwngpt-shared, target: /shared}
edges:
  - {from: binary-analysis, to: exploit-verify-loop}
