# A1: Single-agent six-tool profit loop: source fetching -> attack Strategy contract generation -> fork-chain execution to verify profit (up to 5 internal iterations).
# Source: 02-smart-contract document.
name: a1
nodes:
  - id: source-fetch
    prompt: Fetch the target contract's source code and related deployment information, and organize it as the input for subsequent attack analysis.
    max_iterations: 6
  - id: strategy-generation
    prompt: Analyze the target contract's weaknesses and generate the attack Strategy contract code and execution steps.
    max_iterations: 8
  - id: blockchain-state-tool
    prompt: Query on-chain state such as account balances, contract state, and oracle prices on the fork chain, providing context for execution verification.
    container:
      image: ghcr.io/foundry-rs/foundry:latest
      network: bridge
      mounts:
        - {type: volume, source: a1-shared, target: /shared}
  - id: forge-verify-loop
    prompt: Deploy and execute the Strategy contract on the fork chain, using balance changes to determine profitability; revert reasons and balance changes flow back within the node to fix the Strategy, up to 5 rounds, with the internal loop carried by LiteAgent max_iterations.
    max_iterations: 5
    container:
      image: ghcr.io/foundry-rs/foundry:latest
      network: bridge
      mounts:
        - {type: volume, source: a1-shared, target: /shared}
edges:
  - {from: source-fetch, to: strategy-generation}
  - {from: strategy-generation, to: forge-verify-loop}
  - {from: blockchain-state-tool, to: forge-verify-loop}
