# TLS 1.3 Tamarin: annotated RFC → Tamarin modeling → Dolev-Yao symbolic proofs → lemma result summary.
# Source document: 04-protocol
name: tls13-tamarin
nodes:
  - id: annotated-rfc
    prompt: Read the TLS 1.3 RFC and produce a handshake-flow description annotated with security properties, as the basis for modeling.
    max_iterations: 6
  - id: tamarin-model
    prompt: Write the annotated handshake flow as a Tamarin model, covering all handshake modes and declaring the security lemmas to be proved.
    max_iterations: 10
  - id: symbolic-proof
    prompt: Run Tamarin symbolic proofs for all handshake modes under the Dolev-Yao attacker model, verifying each security lemma; when a proof fails, fix the model inside this node and retry.
    max_iterations: 12
    container:
      image: agentflow-tools/tamarin:latest
      memory: 4g
      cpus: 4.0
      timeout: 1800
      mounts:
        - {type: bind, source: ./models, target: /models, read_only: true}
        - {type: volume, source: tls13-tamarin-shared, target: /shared}
  - id: lemma-results
    prompt: Summarize the proof results of each lemma, outputting a pass/fail/pending list with a Chinese-language explanation for each corresponding handshake mode.
    max_iterations: 4
edges:
  - {from: annotated-rfc, to: tamarin-model}
  - {from: tamarin-model, to: symbolic-proof}
  - {from: symbolic-proof, to: lemma-results}
