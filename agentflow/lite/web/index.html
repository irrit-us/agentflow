<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lite Pipeline 监控</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --border: #2a3550; --text: #dbe2f0; --muted: #8a94ad;
    --gray: #6b7280; --blue: #3b82f6; --green: #22c55e; --red: #ef4444;
    --purple: #a855f7; --orange: #f59e0b; --dark: #334155;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  #health { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--green); } .dot.err { background: var(--red); } .dot.unknown { background: var(--gray); }
  #done-flag { font-size: 13px; color: var(--green); }
  #main { display: flex; height: calc(100vh - 45px); }
  #canvas-wrap { position: relative; flex: 1; overflow: auto; }
  #edges { position: absolute; top: 0; left: 0; width: 3000px; height: 2000px; pointer-events: none; }
  #edges line { stroke: var(--border); stroke-width: 2; }
  #nodes { position: absolute; top: 0; left: 0; width: 3000px; height: 2000px; }
  .node { position: absolute; width: 200px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; cursor: grab; user-select: none; }
  .node:active { cursor: grabbing; }
  .node .nid { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; }
  .badge.preparing { background: var(--gray); }
  .badge.processing { background: var(--blue); animation: pulse 1.2s ease-in-out infinite; }
  .badge.finished { background: var(--green); }
  .badge.errored { background: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .node .tokens { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .node.err-border { border-color: var(--red); }
  aside { width: 240px; background: var(--panel); border-left: 1px solid var(--border); padding: 12px 14px; overflow-y: auto; }
  aside h3 { margin: 0 0 10px; font-size: 14px; }
  aside ul { margin: 0; padding: 0; list-style: none; font-size: 13px; }
  aside li { padding: 6px 0; border-bottom: 1px solid var(--border); }
  aside li .waiting { color: var(--muted); font-size: 12px; }
  #drawer { position: fixed; top: 0; right: -520px; width: 500px; height: 100vh; background: var(--panel); border-left: 1px solid var(--border); transition: right 0.2s; display: flex; flex-direction: column; z-index: 10; }
  #drawer.open { right: 0; }
  #drawer header { justify-content: space-between; }
  #drawer-close { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #drawer-body { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin-bottom: 12px; border-radius: 8px; padding: 8px 10px; border-left: 3px solid var(--border); background: rgba(255,255,255,0.03); }
  .msg .role { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .msg pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; font-size: 13px; font-family: Consolas, monospace; }
  .msg.role-system { border-left-color: var(--purple); } .msg.role-system .role { color: var(--purple); }
  .msg.role-user { border-left-color: var(--dark); } .msg.role-user .role { color: var(--text); }
  .msg.role-assistant { border-left-color: var(--blue); } .msg.role-assistant .role { color: var(--blue); }
  .msg.role-tool { border-left-color: var(--orange); } .msg.role-tool .role { color: var(--orange); }
  details { margin-top: 6px; }
  summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  #drawer-footer { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  #drawer-footer .error { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1 id="title">Lite Pipeline 监控</h1>
  <span id="health"><span id="health-dot" class="dot unknown"></span><span id="health-text">检查中…</span></span>
  <span id="done-flag"></span>
</header>
<div id="main">
  <div id="canvas-wrap">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>
  <aside>
    <h3>阻塞任务</h3>
    <ul id="blocked"><li class="waiting">暂无</li></ul>
  </aside>
</div>
<div id="drawer">
  <header>
    <h1 id="drawer-title">节点详情</h1>
    <button id="drawer-close">关闭</button>
  </header>
  <div id="drawer-body"></div>
  <div id="drawer-footer"></div>
</div>
<script>
const STATUS_TEXT = { preparing: "等待中", processing: "运行中", finished: "已完成", errored: "失败" };
const NODE_W = 200, NODE_H = 78;
let graphName = "pipeline";
let positions = {};
let nodesById = {};
let edges = [];
let layoutDone = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function storageKey() { return "lite-monitor-positions:" + graphName; }
function loadPositions() { try { positions = JSON.parse(localStorage.getItem(storageKey())) || {}; } catch (e) { positions = {}; } }
function savePositions() { localStorage.setItem(storageKey(), JSON.stringify(positions)); }

function computeLayers(ids) {
  const indeg = {}, adj = {};
  ids.forEach(id => { indeg[id] = 0; adj[id] = []; });
  edges.forEach(([f, t]) => { if (indeg[f] !== undefined && indeg[t] !== undefined) { indeg[t]++; adj[f].push(t); } });
  let layer = ids.filter(id => indeg[id] === 0);
  const layers = [], seen = new Set();
  while (layer.length) {
    layers.push(layer);
    const next = [];
    layer.forEach(n => { seen.add(n); adj[n].forEach(m => { if (--indeg[m] === 0) next.push(m); }); });
    layer = next;
  }
  ids.forEach(id => { if (!seen.has(id)) layers.push([id]); });
  return layers;
}

function ensureLayout(ids) {
  if (layoutDone) return;
  loadPositions();
  computeLayers(ids).forEach((layer, li) => {
    layer.forEach((id, idx) => {
      if (!positions[id]) positions[id] = { x: 60 + li * 280, y: 60 + idx * 130 };
    });
  });
  layoutDone = true;
}

function renderNodes() {
  const container = document.getElementById("nodes");
  container.innerHTML = "";
  Object.values(nodesById).forEach(n => {
    const pos = positions[n.id] || { x: 60, y: 60 };
    const div = document.createElement("div");
    div.className = "node" + (n.status === "errored" ? " err-border" : "");
    div.style.left = pos.x + "px";
    div.style.top = pos.y + "px";
    div.dataset.nodeId = n.id;
    const tokens = n.usage ? n.usage.total_tokens + " tokens" : "";
    div.innerHTML =
      '<div class="nid">' + esc(n.id) + "</div>" +
      '<span class="badge ' + n.status + '">' + (STATUS_TEXT[n.status] || n.status) + "</span>" +
      '<div class="tokens">' + esc(tokens) + "</div>";
    attachDrag(div, n.id);
    div.addEventListener("click", () => openDrawer(n.id));
    container.appendChild(div);
  });
  drawEdges();
}

function drawEdges() {
  const svg = document.getElementById("edges");
  svg.innerHTML = "";
  edges.forEach(([f, t]) => {
    const a = positions[f], b = positions[t];
    if (!a || !b) return;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", a.x + NODE_W); line.setAttribute("y1", a.y + NODE_H / 2);
    line.setAttribute("x2", b.x); line.setAttribute("y2", b.y + NODE_H / 2);
    svg.appendChild(line);
  });
}

function attachDrag(div, id) {
  let startX, startY, origX, origY, moved;
  div.addEventListener("mousedown", e => {
    startX = e.clientX; startY = e.clientY;
    origX = positions[id].x; origY = positions[id].y;
    moved = false;
    function onMove(ev) {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      positions[id] = { x: origX + dx, y: origY + dy };
      div.style.left = positions[id].x + "px";
      div.style.top = positions[id].y + "px";
      drawEdges();
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      if (moved) savePositions();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    e.preventDefault();
  });
}

async function pollState() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    if (data.name !== graphName) { graphName = data.name; layoutDone = false; positions = {}; }
    nodesById = {};
    data.nodes.forEach(n => { nodesById[n.id] = n; });
    edges = data.edges;
    ensureLayout(data.nodes.map(n => n.id));
    document.getElementById("title").textContent = "Lite Pipeline 监控 · " + data.name;
    document.getElementById("done-flag").textContent = data.done ? "✔ 全部完成" : "";
    renderNodes();
  } catch (e) { /* 服务暂不可达，下一轮重试 */ }
}

async function pollHealth() {
  const dot = document.getElementById("health-dot");
  const text = document.getElementById("health-text");
  try {
    const res = await fetch("/api/health");
    const data = await res.json();
    const llm = data.llm || { status: "unknown" };
    if (llm.status === "ok") {
      dot.className = "dot ok";
      text.textContent = "API 正常 · " + llm.latency_ms + "ms";
      text.title = "";
    } else if (llm.status === "error") {
      dot.className = "dot err";
      text.textContent = "API 异常";
      text.title = llm.error || "";
    } else {
      dot.className = "dot unknown";
      text.textContent = "API 状态未知";
      text.title = "";
    }
  } catch (e) {
    dot.className = "dot err";
    text.textContent = "监控服务不可达";
    text.title = String(e);
  }
}

async function pollBlocked() {
  const list = document.getElementById("blocked");
  try {
    const res = await fetch("/api/blocked");
    const data = await res.json();
    if (!data.blocked.length) {
      list.innerHTML = '<li class="waiting">暂无</li>';
      return;
    }
    list.innerHTML = data.blocked.map(b =>
      "<li><b>" + esc(b.node_id) + '</b><br><span class="waiting">等待: ' +
      esc(b.waiting_on.join(", ")) + "</span></li>"
    ).join("");
  } catch (e) { /* 下一轮重试 */ }
}

async function openDrawer(id) {
  const drawer = document.getElementById("drawer");
  const body = document.getElementById("drawer-body");
  const footer = document.getElementById("drawer-footer");
  document.getElementById("drawer-title").textContent = "节点: " + id;
  body.innerHTML = "加载中…";
  footer.innerHTML = "";
  drawer.classList.add("open");
  try {
    const res = await fetch("/api/nodes/" + encodeURIComponent(id) + "/inspect");
    if (!res.ok) { body.innerHTML = "加载失败: HTTP " + res.status; return; }
    const data = await res.json();
    if (!data.messages.length) {
      body.innerHTML = '<div class="msg"><pre>暂无消息（节点尚未产出结果）</pre></div>';
    } else {
      body.innerHTML = data.messages.map(renderMessage).join("");
    }
    let foot = "";
    if (data.usage) foot += "tokens: " + data.usage.total_tokens +
      " (prompt " + data.usage.prompt_tokens + " + completion " + data.usage.completion_tokens + ") · ";
    if (data.iterations != null) foot += "迭代: " + data.iterations + " · ";
    foot += "状态: " + (STATUS_TEXT[data.status] || data.status);
    if (data.error) foot += '<br><span class="error">错误: ' + esc(data.error) + "</span>";
    footer.innerHTML = foot;
  } catch (e) {
    body.innerHTML = "加载失败: " + esc(e);
  }
}

function renderMessage(m) {
  let inner = '<div class="role">' + esc(m.role) + "</div>";
  if (m.content) inner += "<pre>" + esc(m.content) + "</pre>";
  if (m.tool_calls) {
    m.tool_calls.forEach(call => {
      inner += "<details><summary>调用工具: " + esc(call.name) + "</summary><pre>" +
        esc(JSON.stringify(call.arguments, null, 2)) + "</pre></details>";
    });
  }
  if (m.role === "tool" && m.content) {
    inner = '<div class="role">tool</div><details><summary>工具返回 (' + esc(m.tool_call_id || "") + ")</summary><pre>" +
      esc(m.content) + "</pre></details>";
  }
  return '<div class="msg role-' + esc(m.role) + '">' + inner + "</div>";
}

document.getElementById("drawer-close").addEventListener("click", () => {
  document.getElementById("drawer").classList.remove("open");
});

pollState(); pollHealth(); pollBlocked();
setInterval(pollState, 1000);
setInterval(pollHealth, 3000);
setInterval(pollBlocked, 2000);
</script>
</body>
</html>
